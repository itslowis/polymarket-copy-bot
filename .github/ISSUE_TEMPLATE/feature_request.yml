name: Feature request
description: Suggest a change or new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please open an issue before starting work on a large change, so effort is not wasted
        on something that will not be merged.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the bot makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including whether existing configuration already covers this.

  - type: checkboxes
    id: risk
    attributes:
      label: Risk
      description: This project moves real money, so safety-affecting proposals need extra discussion.
      options:
        - label: This proposal would remove or weaken an existing safety limit, or increase how much a user can risk automatically

  - type: checkboxes
    id: offer
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this
